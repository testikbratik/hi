<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Arena — Твой главный игровой клуб</title>
  <!-- Подключение Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Подключение шрифта Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen selection:bg-emerald-500 selection:text-black">

  <!-- ========================================== -->
  <!-- 1. HERO СЕКЦИЯ (Переписано из React в HTML) -->
  <!-- ========================================== -->
  <section class="relative bg-neutral-950 text-white min-h-[85vh] flex items-center justify-center px-6 overflow-hidden border-b border-purple-900/30">
    <!-- Неоновые размытые свечения на фоне -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-emerald-500/15 blur-[100px] rounded-full pointer-events-none"></div>

    <div class="relative z-10 max-w-4xl text-center space-y-6">
      <!-- Бейдж -->
      <span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        Next-Gen Gaming Zone
      </span>

      <!-- Главный заголовок с градиентным текстом -->
      <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
        Cyber Arena — <br />
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-purple-500">
          Твой главный игровой клуб
        </span>
      </h1>

      <!-- Подзаголовок -->
      <p class="text-lg sm:text-xl text-neutral-400 max-w-2xl mx-auto leading-relaxed">
        Мощные ПК на RTX 4080, 240Hz мониторы и топовая периферия
      </p>

      <!-- Кнопка действия -->
      <div class="pt-4">
        <button class="px-8 py-4 bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold rounded-xl shadow-[0_0_25px_rgba(16,185,129,0.4)] hover:shadow-[0_0_35px_rgba(16,185,129,0.6)] transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
          Забронировать ПК
        </button>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 2. СЕКЦИЯ ТАРИФОВ И ИГРОВЫХ ЗОН (Массив + JS) -->
  <!-- ========================================== -->
  <section class="bg-neutral-950 py-16 px-6">
    <div class="max-w-6xl mx-auto">
      <h2 class="text-3xl font-extrabold text-white text-center mb-10 tracking-tight">
        Наши игровые зоны
      </h2>

      <!-- Контейнер для карточек, заполняемый через JS (аналог .map в React) -->
      <div id="zones-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>
  </section>

  <!-- Скрипт рендеринга карточек (Аналог компонента + props + map в React) -->
  <script>
    // Массив данных карточек
    const zonesData = [
      { id: 1, name: 'Standard Zone', spec: 'RTX 3060, i5 12th, 144Hz', price: '15 000 сум/час' },
      { id: 2, name: 'VIP Zone', spec: 'RTX 4070, i7 13th, 240Hz', price: '25 000 сум/час' },
      { id: 3, name: 'Bootcamp 5v5', spec: 'RTX 4080, i9 13th, 360Hz', price: '35 000 сум/час' },
      { id: 4, name: 'PS5 & Lounge', spec: '4K OLED 65", DualSense Edge', price: '30 000 сум/час' }
    ];

    // Функция-компонент карточки (передача данных через параметры-props)
    function createZoneCard({ name, spec, price }) {
      return `
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 hover:border-emerald-500/50 transition-all duration-300 hover:shadow-[0_0_20px_rgba(16,185,129,0.15)] flex flex-col justify-between">
          <div>
            <h3 class="text-xl font-bold text-white mb-2">${name}</h3>
            <p class="text-neutral-400 text-sm mb-4">${spec}</p>
          </div>
          <div class="pt-4 border-t border-neutral-800 flex items-center justify-between">
            <span class="text-emerald-400 font-extrabold text-lg">${price}</span>
            <button class="px-4 py-2 bg-neutral-800 hover:bg-emerald-500 hover:text-neutral-950 text-white text-sm font-semibold rounded-lg transition-colors duration-200 cursor-pointer">
              Выбрать
            </button>
          </div>
        </div>
      `;
    }

    // Рендеринг списка карточек через map()
    const container = document.getElementById('zones-grid');
    if (container) {
      container.innerHTML = zonesData.map(zone => createZoneCard(zone)).join('');
    }
  </script>
</body>
</html>
